name: TravelBudget
options:
  bundleIdPrefix: com.travelbudget
  deploymentTarget:
    iOS: "17.0"
packages:
  TravelBudgetCore:
    path: .
targets:
  TravelBudget:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["README.md"]
    dependencies:
      - package: TravelBudgetCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 여행 경비
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.travelbudget.rateRefresh]
        NSCameraUsageDescription: 영수증을 스캔하기 위해 카메라를 사용합니다.
        # 표준 암호화만 사용 → TestFlight 업로드 시 수출 규정 질문을 건너뛴다.
        ITSAppUsesNonExemptEncryption: false
        EXCHANGE_RATE_API_KEY: $(EXCHANGE_RATE_API_KEY)
        ENABLE_CLOUDKIT: $(ENABLE_CLOUDKIT)
    settings:
      base:
        # 번들 ID는 전 세계에서 고유해야 하므로 CI에서 BUNDLE_ID 변수로 덮어쓸 수 있다.
        PRODUCT_BUNDLE_IDENTIFIER: com.travelbudget.app
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        # CI가 실행 번호로 덮어써서 업로드마다 빌드 번호가 증가한다.
        CURRENT_PROJECT_VERSION: "1"
        # 빌드 시 `EXCHANGE_RATE_API_KEY=...` 로 덮어쓴다. 저장소에는 키를 넣지 않는다.
        EXCHANGE_RATE_API_KEY: ""
        # CloudKit은 iCloud entitlement를 추가했을 때만 YES로 바꾼다. (App/README.md 참고)
        ENABLE_CLOUDKIT: "NO"
