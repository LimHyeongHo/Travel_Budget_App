name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 패키지 테스트 + iOS 시뮬레이터 빌드
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 실패 시 로그 인증 없이도 볼 수 있도록 오류 줄을 주석(annotation)으로 남긴다.
      - name: 패키지 테스트 (macOS)
        run: |
          swift test 2>&1 | tee test.log && exit 0
          msg=$(grep -E "error:|✘|Fatal error|Issue recorded" test.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=swift test 실패::$msg"
          exit 1

      - name: XcodeGen 설치 및 프로젝트 생성
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iOS 시뮬레이터용 앱 빌드
        run: |
          xcodebuild build \
            -project TravelBudget.xcodeproj \
            -scheme TravelBudget \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log && exit 0
          msg=$(grep -E "error:" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=xcodebuild 실패::$msg"
          exit 1

  # 수동 실행 전용: 서명·아카이브 후 TestFlight(App Store Connect)로 업로드한다.
  testflight:
    name: TestFlight 업로드
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26 # App Store 업로드는 최신 Xcode(26+) SDK 빌드가 필요하다.
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 필수 시크릿 확인
        run: |
          for name in TEAM_ID KEY_ID ISSUER_ID KEY_P8 API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::시크릿이 비어 있습니다: $name"; exit 1; fi
          done

      - name: XcodeGen 설치 및 프로젝트 생성
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 아카이브
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          xcodebuild archive \
            -project TravelBudget.xcodeproj \
            -scheme TravelBudget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TravelBudget.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID:-com.travelbudget.app}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            EXCHANGE_RATE_API_KEY="$API_KEY"

      - name: 내보내기 및 App Store Connect 업로드
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TravelBudget.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
